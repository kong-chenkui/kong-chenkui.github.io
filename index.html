<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>kong-chenkui</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
    }
    .card:hover { transform: translateY(-6px); }
    h1 { font-weight: 600; font-size: 2.2rem; margin-bottom: 12px; letter-spacing: -0.5px; }
    p { font-weight: 300; opacity: 0.8; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      padding: 10px 24px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      color: white;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div class="card">
    <h1>kong-chenkui</h1>
    <p>An engineer in the making.<br>Building things that matter.</p>
    <a href="#" class="btn">Explore →</a>
  </div>
</body>
</html>
